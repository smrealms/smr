# Static assets (with no cache-bust), cache for 1 week
<FilesMatch "\.(ico|jpg|png|gif|svg|woff)$">
  Header set Cache-Control "max-age=604800, public"
</FilesMatch>

# Auto-generated asset files outside the normal web root
Alias /assets/ /smr/assets/
<Directory /smr/assets>
  Require all granted
</Directory>

# Static assets (with cache-bust), cache for 1 year
<LocationMatch "^/assets/">
  Header set Cache-Control "max-age=31536000, public, immutable"
</LocationMatch>
